name: Feature request
description: A tool, source or behaviour you want
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What question can the server not answer today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Tool name, inputs, and the shape of the answer you expect.
  - type: input
    id: source
    attributes:
      label: Data source (if any)
      description: Public API or document the feature would depend on. Include the endpoint.
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: It can be answered from public, read-only data (no accounts, no scraping behind a login).
          required: true
        - label: It does not require telemetry or sending deck data to a server.
          required: true
